<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NMS PLAYER — لوحة الأكواد</title>
<style>
  :root{
    --blue:#2E7DF6; --blue-dk:#1B5FD0; --bg:#0B1220; --panel:#141C2E;
    --panel-2:#1B2439; --line:#26324A; --txt:#EAF0FB; --muted:#8FA0BD;
    --green:#22C55E; --red:#EF4444; --amber:#F59E0B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px}
  .hidden{display:none!important}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;
    padding:10px 16px;font-size:14px;font-weight:600}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-dk)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn-ghost:hover{color:var(--txt);border-color:var(--blue)}
  .btn-danger{background:transparent;color:var(--red);border:1px solid #3a2530}
  .btn-danger:hover{background:var(--red);color:#fff}
  input{font-family:inherit;background:var(--panel-2);border:1px solid var(--line);
    color:var(--txt);border-radius:10px;padding:11px 14px;font-size:14px;width:100%}
  input:focus{outline:none;border-color:var(--blue)}

  /* ---- Login ---- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:32px;width:100%;max-width:380px}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
  .brand b{font-size:24px;letter-spacing:.5px}
  .brand .p{color:var(--blue)}
  .login-sub{color:var(--muted);text-align:center;margin:0 0 22px;font-size:13px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .login-err{color:var(--red);font-size:13px;min-height:18px;margin-top:4px;text-align:center}

  /* ---- Shell ---- */
  header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:14px 20px}
  header .brand{margin:0}
  header .brand b{font-size:18px}
  header .spacer{flex:1}
  .who{color:var(--muted);font-size:12px}
  .wrap{max-width:1000px;margin:0 auto;padding:20px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
  .stat .n{font-size:30px;font-weight:800;line-height:1}
  .stat .l{color:var(--muted);font-size:12px;margin-top:6px}
  .stat.total .n{color:var(--txt)} .stat.used .n{color:var(--amber)} .stat.free .n{color:var(--green)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar .search{flex:1;min-width:180px}
  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
  .tab{padding:7px 14px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
  .tab.active{background:var(--blue);color:#fff}

  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;overflow:hidden}
  th,td{padding:12px 14px;text-align:right;font-size:14px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;background:var(--panel-2)}
  tr:last-child td{border-bottom:none}
  .code{font-family:"SF Mono",Menlo,Consolas,monospace;letter-spacing:.5px;font-weight:700}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .badge.free{background:rgba(34,197,94,.14);color:var(--green)}
  .badge.used{background:rgba(245,158,11,.14);color:var(--amber)}
  .dev{color:var(--muted);font-size:12px;font-family:monospace;max-width:150px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .buyer-in{padding:6px 8px;font-size:12px;background:var(--panel-2)}
  .row-actions{display:flex;gap:6px;justify-content:flex-start}
  .row-actions button{padding:6px 10px;font-size:12px}
  .empty{text-align:center;color:var(--muted);padding:40px}

  /* ---- Modal ---- */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;
    align-items:center;justify-content:center;z-index:20;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:24px;width:100%;max-width:440px}
  .modal h3{margin:0 0 4px}
  .modal p{color:var(--muted);font-size:13px;margin:0 0 16px}
  .modal .actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}
  .hint{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.6}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--line);color:var(--txt);
    padding:12px 20px;border-radius:12px;z-index:40;font-size:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .config-warn{background:#2a1f10;border:1px solid #6b4e18;color:#f0c674;
    padding:14px 16px;border-radius:12px;margin:20px;font-size:13px;line-height:1.7}
  code{background:var(--panel-2);padding:2px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>

<!-- =============================================================
     STEP 1 — ضع إعدادات Firebase هنا (انسخها من صفحة "رفع الأكواد")
     Firebase Console > Project settings > "Your apps" > SDK setup
============================================================== -->
<script>
  const FIREBASE_CONFIG = {
    apiKey:            "AIzaSyBtbx1mLPoABObVi-dmFu7PP6S4BwUOQY8",
    authDomain:        "nms-player.firebaseapp.com",
    projectId:         "nms-player",
    storageBucket:     "nms-player.firebasestorage.app",
    messagingSenderId: "175465922473",
    appId:             "1:175465922473:web:9a16ff0d947b60c7eb0eb8"
  };
  const CODES_COLLECTION = "codes";   // اسم مجموعة الأكواد في Firestore
</script>

<!-- Firebase SDK is loaded dynamically at runtime (see loadFirebase below),
     with a CDN fallback, so a blocked CDN shows a clear message instead of failing silently. -->

<!-- ---------------- LOGIN ---------------- -->
<div id="login">
  <div class="login-card">
    <div class="brand"><b>NMS <span class="p">PLAYER</span></b></div>
    <p class="login-sub">لوحة إدارة الأكواد</p>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" placeholder="admin@example.com" />
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" />
    </div>
    <button class="btn-primary" style="width:100%" onclick="doLogin()">تسجيل الدخول</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ---------------- DASHBOARD ---------------- -->
<div id="app" class="hidden">
  <header>
    <div class="brand"><b>NMS <span class="p">PLAYER</span></b></div>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button class="btn-ghost" onclick="doLogout()">خروج</button>
  </header>

  <div class="wrap">
    <div class="stats">
      <div class="stat total"><div class="n" id="stTotal">0</div><div class="l">إجمالي الأكواد</div></div>
      <div class="stat used"><div class="n" id="stUsed">0</div><div class="l">مُفعّلة</div></div>
      <div class="stat free"><div class="n" id="stFree">0</div><div class="l">متاحة</div></div>
    </div>

    <div class="toolbar">
      <div class="search"><input id="search" placeholder="ابحث بالكود أو معرّف الجهاز…" oninput="render()" /></div>
      <div class="tabs">
        <div class="tab active" data-f="all"  onclick="setFilter('all',this)">الكل</div>
        <div class="tab"        data-f="free" onclick="setFilter('free',this)">المتاحة</div>
        <div class="tab"        data-f="used" onclick="setFilter('used',this)">المُفعّلة</div>
      </div>
      <button class="btn-primary" onclick="openAdd()">+ إضافة</button>
      <button class="btn-ghost" onclick="openBatch()">توليد دفعة</button>
      <button class="btn-ghost" onclick="exportCsv()">تصدير CSV</button>
    </div>

    <table>
      <thead><tr>
        <th>الكود</th><th>الحالة</th><th>الجهاز</th><th>المشتري</th><th style="width:130px">إجراءات</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty hidden">لا توجد أكواد مطابقة.</div>
  </div>
</div>

<div id="modalHost"></div>

<script>
/* ------------------------------------------------------------------ */
let db, auth, allCodes = [], filter = 'all', unsub = null;

function configReady(){ return !FIREBASE_CONFIG.apiKey.startsWith("PASTE"); }

/* Load one script, trying each URL in order until one succeeds. */
function loadScript(urls){
  return new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if(i >= urls.length){ reject(new Error("all sources failed")); return; }
      const s = document.createElement('script');
      s.src = urls[i++];
      s.onload = resolve;
      s.onerror = tryNext;
      document.head.appendChild(s);
    };
    tryNext();
  });
}

const SDK = v => ([
  `https://www.gstatic.com/firebasejs/10.12.5/firebase-${v}-compat.js`,
  `https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-${v}-compat.js`,
  `https://unpkg.com/firebase@10.12.5/firebase-${v}-compat.js`
]);

async function loadFirebase(){
  await loadScript(SDK('app'));
  await loadScript(SDK('auth'));
  await loadScript(SDK('firestore'));
  if(typeof firebase === 'undefined') throw new Error("firebase undefined after load");
}

function fatal(msg){
  document.body.insertAdjacentHTML('afterbegin',
    '<div class="config-warn">⚠️ '+msg+'</div>');
}

window.addEventListener('load', async () => {
  if(!configReady()){
    fatal('لم تُضبط إعدادات Firebase بعد. افتح الملف بمحرّر نصوص وضع القيم داخل <code>FIREBASE_CONFIG</code>.');
    return;
  }
  try {
    await loadFirebase();
  } catch(e){
    fatal('تعذّر تحميل مكتبة Firebase من الإنترنت. تأكّد من الاتصال بالإنترنت، وجرّب متصفّح Chrome أو Edge، وأوقف أي مانع إعلانات ثم أعد فتح الصفحة.');
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  auth.onAuthStateChanged(user => user ? showApp(user) : showLogin());
});

/* ---------------- Auth ---------------- */
function doLogin(){
  const email = val('email'), pass = val('pass');
  err('loginErr','');
  auth.signInWithEmailAndPassword(email, pass)
    .catch(e => err('loginErr', mapAuthErr(e.code)));
}
function doLogout(){ if(unsub) unsub(); auth.signOut(); }

function showLogin(){ show('login'); hide('app'); }
function showApp(user){
  hide('login'); show('app');
  document.getElementById('who').textContent = user.email;
  listen();
}

/* ---------------- Live data ---------------- */
function listen(){
  if(unsub) unsub();
  unsub = db.collection(CODES_COLLECTION).onSnapshot(snap => {
    allCodes = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    allCodes.sort((a,b)=>a.id.localeCompare(b.id));
    updateStats(); render();
  }, e => toast('خطأ في القراءة: '+e.message));
}

function updateStats(){
  const total = allCodes.length;
  const used = allCodes.filter(isUsed).length;
  set('stTotal', total); set('stUsed', used); set('stFree', total-used);
}

/* ---------------- Render ---------------- */
function setFilter(f, el){
  filter = f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active'); render();
}

function render(){
  const q = val('search').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  const rows = document.getElementById('rows');
  const list = allCodes.filter(c => {
    if(filter==='used' && !isUsed(c)) return false;
    if(filter==='free' &&  isUsed(c)) return false;
    if(q){
      const dev = (c.deviceId||'').toUpperCase();
      if(!c.id.includes(q) && !dev.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('empty').classList.toggle('hidden', list.length>0);
  rows.innerHTML = list.map(c => {
    const used = isUsed(c);
    return `<tr>
      <td class="code">${fmt(c.id)}</td>
      <td><span class="badge ${used?'used':'free'}">${used?'مُفعّل':'متاح'}</span></td>
      <td><div class="dev" title="${esc(c.deviceId||'')}">${esc(c.deviceId||'—')}</div></td>
      <td><input class="buyer-in" value="${esc(c.buyer||'')}" placeholder="اسم المشتري"
            onchange="saveBuyer('${c.id}', this.value)"></td>
      <td><div class="row-actions">
        ${used?`<button class="btn-ghost" onclick="resetCode('${c.id}')">تحرير</button>`:''}
        <button class="btn-danger" onclick="delCode('${c.id}')">حذف</button>
      </div></td>
    </tr>`;
  }).join('');
}

/* ---------------- Actions ---------------- */
function resetCode(id){
  confirmBox('تحرير الكود؟', `سيعود الكود ${fmt(id)} إلى «متاح» ويُفصَل عن الجهاز الحالي.`, () => {
    db.collection(CODES_COLLECTION).doc(id).update({ used:false, deviceId:"" })
      .then(()=>toast('تم تحرير الكود')).catch(e=>toast('فشل: '+e.message));
  });
}
function delCode(id){
  confirmBox('حذف الكود؟', `سيُحذف ${fmt(id)} نهائياً. لا يمكن التراجع.`, () => {
    db.collection(CODES_COLLECTION).doc(id).delete()
      .then(()=>toast('تم الحذف')).catch(e=>toast('فشل الحذف: '+e.message+' — تأكّد من قواعد الأمان'));
  }, true);
}
function saveBuyer(id, name){
  db.collection(CODES_COLLECTION).doc(id).update({ buyer:name.trim() })
    .then(()=>toast('حُفظ المشتري')).catch(e=>toast('فشل: '+e.message));
}

/* ---- Add single ---- */
function openAdd(){
  modal(`<h3>إضافة كود</h3><p>يُحفَظ بدون شرطات كمعرّف المستند.</p>
    <input id="newCode" placeholder="XXXX-XXXX-XXXX" oninput="this.value=this.value.toUpperCase()">
    <div class="hint">اتركه فارغاً واضغط «توليد» لإنشاء كود عشوائي.</div>
    <div class="actions">
      <button class="btn-ghost" onclick="document.getElementById('newCode').value=fmt(genCode())">توليد</button>
      <button class="btn-primary" onclick="addCode()">حفظ</button>
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>`);
}
function addCode(){
  const id = norm(val('newCode'));
  if(id.length < 8) return toast('كود غير صالح');
  db.collection(CODES_COLLECTION).doc(id).get().then(doc => {
    if(doc.exists) return toast('الكود موجود مسبقاً');
    db.collection(CODES_COLLECTION).doc(id).set({ used:false, deviceId:"" })
      .then(()=>{ toast('أُضيف الكود'); closeModal(); })
      .catch(e=>toast('فشل: '+e.message+' — تأكّد من قواعد الأمان'));
  });
}

/* ---- Batch generate ---- */
function openBatch(){
  modal(`<h3>توليد دفعة أكواد</h3><p>تُنشأ أكواد عشوائية فريدة وتُرفع دفعة واحدة.</p>
    <input id="batchN" type="number" value="50" min="1" max="200">
    <div class="hint">تتطلّب صلاحية إنشاء في قواعد Firestore (كن مسجّل الدخول كأدمن).</div>
    <div class="actions">
      <button class="btn-primary" onclick="runBatch()">توليد ورفع</button>
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>`);
}
async function runBatch(){
  const n = Math.max(1, Math.min(200, parseInt(val('batchN'))||0));
  const existing = new Set(allCodes.map(c=>c.id));
  const fresh = [];
  while(fresh.length < n){
    const c = genCode();
    if(!existing.has(c)){ existing.add(c); fresh.push(c); }
  }
  toast('جارٍ الرفع…');
  try{
    // batched writes (max 500 per batch; we cap at 200)
    const batch = db.batch();
    fresh.forEach(id => batch.set(db.collection(CODES_COLLECTION).doc(id), { used:false, deviceId:"" }));
    await batch.commit();
    closeModal();
    toast(`أُضيف ${fresh.length} كود`);
    downloadFile('nms_new_codes.csv',
      'code_for_customer,document_id,buyer\n' + fresh.map(c=>`${fmt(c)},${c},`).join('\n'));
  }catch(e){ toast('فشل الرفع: '+e.message+' — تأكّد من قواعد الأمان'); }
}

/* ---- Export ---- */
function exportCsv(){
  const rows = allCodes.map(c =>
    `${fmt(c.id)},${c.id},${isUsed(c)?'used':'free'},${(c.deviceId||'').replace(/,/g,' ')},${(c.buyer||'').replace(/,/g,' ')}`);
  downloadFile('nms_codes_export.csv',
    'code_for_customer,document_id,status,device_id,buyer\n'+rows.join('\n'));
}

/* ---------------- Helpers ---------------- */
function isUsed(c){ return c.used === true; }
function norm(s){ return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function fmt(id){ return norm(id).replace(/(.{4})/g,'$1-').replace(/-$/,''); }
function genCode(){
  const cs='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='';
  for(let i=0;i<12;i++) s+=cs[Math.floor(Math.random()*cs.length)];
  return s;
}
function downloadFile(name, text){
  const b=new Blob([text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=name; a.click();
}
function val(id){ return document.getElementById(id).value; }
function set(id,v){ document.getElementById(id).textContent=v; }
function err(id,v){ document.getElementById(id).textContent=v; }
function show(id){ document.getElementById(id).classList.remove('hidden'); }
function hide(id){ document.getElementById(id).classList.add('hidden'); }
function esc(s){ return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function mapAuthErr(code){
  return ({
    'auth/invalid-email':'بريد غير صالح',
    'auth/user-not-found':'المستخدم غير موجود',
    'auth/wrong-password':'كلمة المرور خاطئة',
    'auth/invalid-credential':'بيانات الدخول غير صحيحة',
    'auth/too-many-requests':'محاولات كثيرة — انتظر قليلاً'
  })[code] || 'تعذّر تسجيل الدخول';
}

/* ---- Modal utils ---- */
function modal(html){
  document.getElementById('modalHost').innerHTML =
    `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }
function confirmBox(title, msg, onYes, danger){
  window.__yes = onYes;
  modal(`<h3>${title}</h3><p>${msg}</p><div class="actions">
    <button class="${danger?'btn-danger':'btn-primary'}" onclick="__yes();closeModal()">تأكيد</button>
    <button class="btn-ghost" onclick="closeModal()">إلغاء</button></div>`);
}
</script>
</body>
</html>
